<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emil — PH Live Broadcast Center (2000+ Stations)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #05140e;
            --bg-card: #081c14;
            --emerald-glow: #10b981;
            --emerald-bright: #34d399;
            --emerald-dim: rgba(16, 185, 129, 0.15);
            --border-glass: rgba(52, 211, 153, 0.2);
            --text-main: #ecfdf5;
            --text-muted: #6ee7b7;
            --accent-red: #f43f5e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            background-image: radial-gradient(circle at 50% 20%, #064e3b 0%, var(--bg-deep) 70%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .app-container {
            width: 100%;
            max-width: 460px;
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: 32px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), inset 0 0 30px rgba(16, 185, 129, 0.05);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding-bottom: 20px;
        }

        /* Top Header */
        .app-header {
            padding: 20px 24px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            font-size: 1.5rem;
            color: var(--emerald-bright);
            filter: drop-shadow(0 0 8px var(--emerald-glow));
        }

        .app-title {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--text-main);
        }

        .band-switch {
            display: flex;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 3px;
        }

        .band-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 16px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .band-btn.active {
            background: var(--emerald-bright);
            color: var(--bg-deep);
            box-shadow: 0 0 12px var(--emerald-glow);
        }

        /* Donate & Rec Action Banner */
        .top-action-banner {
            padding: 0 24px 14px;
            display: flex;
            gap: 8px;
        }

        .donate-btn {
            flex: 1;
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid var(--emerald-glow);
            color: var(--emerald-bright);
            padding: 10px;
            border-radius: 24px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: 0.2s;
        }

        .donate-btn:hover {
            background: rgba(16, 185, 129, 0.25);
            box-shadow: 0 0 15px var(--emerald-glow);
        }

        .rec-btn {
            background: rgba(244, 63, 94, 0.15);
            border: 1px solid rgba(244, 63, 94, 0.4);
            color: var(--accent-red);
            padding: 10px 16px;
            border-radius: 24px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }

        .rec-btn.recording {
            background: var(--accent-red);
            color: #fff;
            box-shadow: 0 0 15px var(--accent-red);
            animation: pulseRec 1s infinite;
        }

        @keyframes pulseRec {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        /* Tuner Dial Section */
        .tuner-container {
            margin: 0 24px;
            background: rgba(3, 10, 7, 0.6);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            padding: 24px 20px;
            text-align: center;
            position: relative;
            box-shadow: inset 0 4px 20px rgba(0, 0, 0, 0.9);
        }

        /* Kapag nagpe-play, umiikot at gumagalaw ang singsing na parang music visualizer */
        .tuner-ring {
            width: 190px;
            height: 190px;
            margin: 0 auto 14px;
            border-radius: 50%;
            border: 3px dashed rgba(52, 211, 153, 0.35);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.15);
            transition: all 0.3s ease;
        }

        .playing .tuner-ring {
            border-color: var(--emerald-bright);
            box-shadow: 0 0 35px rgba(52, 211, 153, 0.4), inset 0 0 20px rgba(52, 211, 153, 0.3);
            animation: ringPulse 1.8s infinite ease-in-out alternate;
        }

        @keyframes ringPulse {
            0% { transform: scale(0.98); filter: brightness(0.9); }
            100% { transform: scale(1.02); filter: brightness(1.2); }
        }

        .tuner-freq {
            font-size: 2.3rem;
            font-weight: 800;
            color: var(--emerald-bright);
            text-shadow: 0 0 15px var(--emerald-glow);
            letter-spacing: -1px;
        }

        .tuner-unit {
            font-size: 0.78rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
        }

        .tuner-station-name {
            font-size: 0.95rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 240px;
            margin: 0 auto 2px;
        }

        .tuner-location {
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-bottom: 14px;
        }

        /* Slider Control */
        .slider-box {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 10px;
        }

        .slider-box span {
            font-size: 0.7rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .custom-slider {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            outline: none;
        }

        .custom-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--emerald-bright);
            box-shadow: 0 0 10px var(--emerald-glow);
            cursor: pointer;
        }

        /* Region Filter Pills */
        .filter-scroll {
            display: flex;
            gap: 8px;
            padding: 16px 24px 8px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .filter-scroll::-webkit-scrollbar {
            display: none;
        }

        .region-pill {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-glass);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 18px;
            font-size: 0.72rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.2s;
        }

        .region-pill.active {
            background: var(--emerald-bright);
            color: var(--bg-deep);
            border-color: var(--emerald-bright);
            box-shadow: 0 0 12px var(--emerald-glow);
        }

        /* Main Player Controls Bar */
        .main-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
        }

        .seek-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-glass);
            color: var(--text-main);
            padding: 12px 16px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }

        .seek-btn:hover {
            background: rgba(16, 185, 129, 0.15);
            border-color: var(--emerald-glow);
            color: var(--emerald-bright);
        }

        .play-main-btn {
            width: 64px;
            height: 64px;
            background: var(--emerald-bright);
            border: none;
            border-radius: 50%;
            color: var(--bg-deep);
            font-size: 1.4rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 25px var(--emerald-glow);
            transition: 0.2s;
        }

        .play-main-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 35px var(--emerald-bright);
        }

        /* Search Bar & Scan Library */
        .search-container {
            padding: 0 24px 10px;
            display: flex;
            gap: 8px;
        }

        .search-input {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-glass);
            padding: 10px 16px;
            border-radius: 16px;
            color: var(--text-main);
            font-size: 0.8rem;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--emerald-bright);
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.2);
        }

        .scan-btn {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid var(--emerald-glow);
            color: var(--emerald-bright);
            padding: 0 14px;
            border-radius: 16px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }

        .scan-btn:hover {
            background: rgba(16, 185, 129, 0.3);
        }

        /* Station List */
        .station-list {
            max-height: 200px;
            overflow-y: auto;
            padding: 0 24px;
        }

        .station-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.025);
            border: 1px solid var(--border-glass);
            padding: 10px 14px;
            border-radius: 16px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .station-item:hover {
            background: rgba(16, 185, 129, 0.08);
            border-color: var(--emerald-glow);
        }

        .station-item.active {
            background: rgba(16, 185, 129, 0.18);
            border-color: var(--emerald-bright);
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.2);
        }

        .st-info h4 {
            font-size: 0.82rem;
            font-weight: 700;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 240px;
        }

        .st-info p {
            font-size: 0.68rem;
            color: var(--text-muted);
        }

        .st-badge {
            font-size: 0.6rem;
            font-weight: 800;
            background: rgba(16, 185, 129, 0.15);
            color: var(--emerald-bright);
            padding: 3px 8px;
            border-radius: 8px;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        /* Footer Credits */
        .app-footer {
            text-align: center;
            padding: 12px 24px 0;
            font-size: 0.65rem;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            border-top: 1px solid var(--border-glass);
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="app-container" id="appContainer">
    <!-- Header -->
    <div class="app-header">
        <div class="logo-area">
            <i class="fa-solid fa-radio logo-icon"></i>
            <span class="app-title">GAPA RADIO PH</span>
        </div>
        <div class="band-switch">
            <button class="band-btn active" id="fmBtn">FM</button>
            <button class="band-btn" id="amBtn">AM</button>
        </div>
    </div>

    <!-- Donate & Recording Buttons -->
    <div class="top-action-banner">
        <button class="donate-btn" onclick="alert('GCash No: 09XXXXXXXXX (Support Radio Okay Broadcast)')">
            <i class="fa-solid fa-heart"></i> GCASH DONATE
        </button>
        <button class="rec-btn" id="recBtn">
            <i class="fa-solid fa-circle"></i> <span id="recText">RECORD</span>
        </button>
    </div>

    <!-- Tuner Display Screen (Umiikot/Lumilikot kapag nagpe-play) -->
    <div class="tuner-container">
        <div class="tuner-ring" id="tunerRing">
            <div class="tuner-freq" id="tunerFreq">90.7</div>
            <div class="tuner-unit" id="tunerUnit">FM</div>
        </div>
        <div class="tuner-station-name" id="tunerName">Kinukuha ang 2,000+ stations...</div>
        <div class="tuner-location" id="tunerLocation">Luzon • Visayas • Mindanao • Davao • GenSan</div>

        <!-- Volume Slider -->
        <div class="slider-box">
            <span id="volMin">VOL</span>
            <input type="range" class="custom-slider" id="volumeSlider" min="0" max="1" step="0.01" value="1">
            <span id="volMax"><i class="fa-solid fa-volume-high"></i></span>
        </div>
    </div>

    <!-- Region / City Filter Pills -->
    <div class="filter-scroll">
        <button class="region-pill active" data-filter="all">All</button>
        <button class="region-pill" data-filter="davao-gensan">Davao / GenSan</button>
        <button class="region-pill" data-filter="mindanao">Mindanao</button>
        <button class="region-pill" data-filter="visayas">Visayas</button>
        <button class="region-pill" data-filter="luzon">Luzon</button>
        <button class="region-pill" data-filter="manila">Manila</button>
    </div>

    <!-- Search Input & Scan Library Button -->
    <div class="search-container">
        <input type="text" class="search-input" id="searchInput" placeholder="Maghanap o mag-scan sa 2,000+ stations...">
        <button class="scan-btn" id="scanBtn" title="Auto Scan Library"><i class="fa-solid fa-satellite-dish"></i> Scan</button>
    </div>

    <!-- Main Player Controls -->
    <div class="main-controls">
        <button class="seek-btn" id="prevBtn"><i class="fa-solid fa-backward-step"></i> SEEK</button>
        <button class="play-main-btn" id="playBtn"><i class="fa-solid fa-play" id="playIcon"></i></button>
        <button class="seek-btn" id="nextBtn">SEEK <i class="fa-solid fa-forward-step"></i></button>
    </div>

    <!-- Station List Container -->
    <div class="station-list" id="stationList"></div>

    <!-- Footer Branding -->
    <div class="app-footer">
        <i class="fa-solid fa-tower-broadcast"></i> RADIO OKAY 2,000+ BROADCAST NETWORK
    </div>
</div>

<audio id="audioPlayer" preload="none"></audio>

<script>
    let allStations = [];
    let filteredStations = [];
    let currentIndex = 0;
    let isPlaying = false;
    let currentBand = 'FM';
    let activeFilter = 'all';

    // Audio Recorder Variables
    let mediaRecorder;
    let recordedChunks = [];
    let isRecording = false;

    const audio = document.getElementById('audioPlayer');
    const appContainer = document.getElementById('appContainer');
    const tunerRing = document.getElementById('tunerRing');
    const tunerFreq = document.getElementById('tunerFreq');
    const tunerUnit = document.getElementById('tunerUnit');
    const tunerName = document.getElementById('tunerName');
    const tunerLocation = document.getElementById('tunerLocation');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const volumeSlider = document.getElementById('volumeSlider');
    const stationList = document.getElementById('stationList');
    const searchInput = document.getElementById('searchInput');
    const scanBtn = document.getElementById('scanBtn');
    const fmBtn = document.getElementById('fmBtn');
    const amBtn = document.getElementById('amBtn');
    const recBtn = document.getElementById('recBtn');
    const recText = document.getElementById('recText');

    const apiMirrors = [
        'https://de1.api.radio-browser.info',
        'https://nl1.api.radio-browser.info',
        'https://at1.api.radio-browser.info'
    ];

    const davaoGensanKeywords = ['davao', 'general santos', 'gensan', 'tagum', 'digos', 'mati', 'kidapawan', 'koronadal'];
    const mindanaoKeywords = [...davaoGensanKeywords, 'mindanao', 'cagayan de oro', 'cdo', 'zamboanga', 'butuan', 'iligan', 'cotabato', 'surigao', 'brigada'];
    const visayasKeywords = ['visayas', 'cebu', 'iloilo', 'bacolod', 'tacloban', 'bohol', 'dumaguete', 'ormoc', 'roxas', 'kalibo'];

    function classifyRegion(name, state, tags) {
        const text = `${name} ${state} ${tags}`.toLowerCase();
        if (davaoGensanKeywords.some(k => text.includes(k))) return 'davao-gensan';
        if (mindanaoKeywords.some(k => text.includes(k))) return 'mindanao';
        if (visayasKeywords.some(k => text.includes(k))) return 'visayas';
        if (text.includes('manila') || text.includes('ncr') || text.includes('quezon city')) return 'manila';
        return 'luzon';
    }

    async function fetchFromMirror(path) {
        for (const base of apiMirrors) {
            try {
                const res = await fetch(`${base}${path}`);
                if (res.ok) return await res.json();
            } catch (err) {
                console.warn(`Mirror unreachable: ${base}`);
            }
        }
        return [];
    }

    async function loadDirectory2000() {
        tunerName.textContent = "Nag-a-access sa 2,000+ PH Stations...";

        // Kumuha ng malawak na koleksyon mula sa Radio Browser API para umabot sa 2000+ stations
        const [ph1, ph2, tagalog, cebuano, davao, gensan, cebu] = await Promise.all([
            fetchFromMirror('/json/stations/bycountrycodeexact/PH?limit=800&hidebroken=true&order=clickcount&reverse=true'),
            fetchFromMirror('/json/stations/bycountrycodeexact/PH?limit=800&offset=800&hidebroken=true'),
            fetchFromMirror('/json/stations/bylanguage/tagalog?limit=300&hidebroken=true'),
            fetchFromMirror('/json/stations/bylanguage/cebuano?limit=200&hidebroken=true'),
            fetchFromMirror('/json/stations/byname/davao?limit=100&hidebroken=true'),
            fetchFromMirror('/json/stations/byname/general%20santos?limit=100&hidebroken=true'),
            fetchFromMirror('/json/stations/byname/cebu?limit=100&hidebroken=true')
        ]);

        const raw = [...davao, ...gensan, ...cebu, ...tagalog, ...cebuano, ...ph1, ...ph2];
        const seen = new Set();
        const list = [];

        raw.forEach(st => {
            const url = (st.url_resolved || st.url || '').trim();
            if (!url.startsWith('https://') || seen.has(url)) return;
            seen.add(url);

            const name = (st.name || 'Radio Station').trim();
            const state = (st.state || 'Philippines').trim();
            const tags = (st.tags || '').toLowerCase();
            const regKey = classifyRegion(name, state, tags);

            list.push({
                name: name,
                url: url,
                state: state,
                region: regKey,
                freq: (Math.random() * (107.9 - 88.1) + 88.1).toFixed(1),
                badge: regKey === 'davao-gensan' ? 'DAVAO/GENSAN' : regKey.toUpperCase()
            });
        });

        allStations = list;
        applyFilters();

        if (allStations.length > 0) {
            selectStation(0, false);
            tunerName.textContent = `${allStations.length}+ Live Stations Handang I-play`;
        } else {
            tunerName.textContent = "Walang nahanap na stream.";
        }
    }

    function applyFilters() {
        const q = searchInput.value.toLowerCase().trim();
        filteredStations = allStations.filter(st => {
            let matchTab = true;
            if (activeFilter === 'davao-gensan') matchTab = st.region === 'davao-gensan';
            else if (activeFilter !== 'all') matchTab = st.region === activeFilter;

            const matchSearch = !q || st.name.toLowerCase().includes(q) || st.state.toLowerCase().includes(q);
            return matchTab && matchSearch;
        });
        renderList();
    }

    function renderList() {
        stationList.innerHTML = '';
        if (filteredStations.length === 0) {
            stationList.innerHTML = '<p style="text-align:center; color:var(--text-muted); font-size:0.75rem; padding:20px;">Walang nahanap na istasyon.</p>';
            return;
        }

        const fragment = document.createDocumentFragment();
        const activeUrl = allStations[currentIndex] ? allStations[currentIndex].url : '';

        filteredStations.forEach(st => {
            const div = document.createElement('div');
            div.className = 'station-item';
            if (st.url === activeUrl) div.classList.add('active');

            div.innerHTML = `
                <div class="st-info">
                    <h4>${st.name}</h4>
                    <p>${st.state}</p>
                </div>
                <span class="st-badge">${st.badge}</span>
            `;

            div.onclick = () => {
                const realIdx = allStations.findIndex(item => item.url === st.url);
                selectStation(realIdx, true);
            };
            fragment.appendChild(div);
        });

        stationList.appendChild(fragment);
    }

    function selectStation(index, autoPlay = true) {
        if (!allStations[index]) return;
        currentIndex = index;
        const st = allStations[index];

        tunerName.textContent = st.name;
        tunerLocation.textContent = `${st.state} • Live Broadcast`;
        tunerFreq.textContent = st.freq;
        tunerUnit.textContent = currentBand;

        audio.src = st.url;
        renderList();

        if (autoPlay) {
            playAudio();
        }
    }

    function playAudio() {
        audio.play().then(() => {
            isPlaying = true;
            playIcon.className = 'fa-solid fa-pause';
            tunerRing.classList.add('playing');
        }).catch(err => {
            console.error(err);
            isPlaying = false;
            playIcon.className = 'fa-solid fa-play';
            tunerRing.classList.remove('playing');
        });
    }

    function pauseAudio() {
        audio.pause();
        isPlaying = false;
        playIcon.className = 'fa-solid fa-play';
        tunerRing.classList.remove('playing');
    }

    playBtn.onclick = () => {
        if (!audio.src && allStations.length > 0) {
            selectStation(0, true);
            return;
        }
        isPlaying ? pauseAudio() : playAudio();
    };

    prevBtn.onclick = () => {
        if (allStations.length === 0) return;
        currentIndex = (currentIndex - 1 + allStations.length) % allStations.length;
        selectStation(currentIndex, true);
    };

    nextBtn.onclick = () => {
        if (allStations.length === 0) return;
        currentIndex = (currentIndex + 1) % allStations.length;
        selectStation(currentIndex, true);
    };

    volumeSlider.oninput = (e) => {
        audio.volume = e.target.value;
    };

    searchInput.oninput = applyFilters;

    // Scan Button Library Action
    scanBtn.onclick = () => {
        searchInput.value = '';
        activeFilter = 'all';
        document.querySelectorAll('.region-pill').forEach(b => b.classList.remove('active'));
        document.querySelector('.region-pill[data-filter="all"]').classList.add('active');
        loadDirectory2000();
    };

    document.querySelectorAll('.region-pill').forEach(btn => {
        btn.onclick = () => {
            document.querySelectorAll('.region-pill').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            activeFilter = btn.dataset.filter;
            applyFilters();
        };
    });

    fmBtn.onclick = () => {
        fmBtn.classList.add('active');
        amBtn.classList.remove('active');
        currentBand = 'FM';
        tunerUnit.textContent = 'FM';
    };

    amBtn.onclick = () => {
        amBtn.classList.add('active');
        fmBtn.classList.remove('active');
        currentBand = 'AM';
        tunerUnit.textContent = 'AM';
    };

    // Live Audio Recording Feature
    recBtn.onclick = () => {
        if (!isRecording) {
            startRecording();
        } else {
            stopRecording();
        }
    };

    function startRecording() {
        recordedChunks = [];
        try {
            const stream = audio.captureStream ? audio.captureStream() : null;
            if (!stream) {
                alert("Ang browser na ito ay hindi sumusuporta sa direct audio stream recording.");
                return;
            }
            mediaRecorder = new MediaRecorder(stream);
            mediaRecorder.ondataavailable = e => {
                if (e.data.size > 0) recordedChunks.push(e.data);
            };
            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'audio/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `Radio-Okay-Record-${new Date().toISOString().slice(0,10)}.webm`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            };
            mediaRecorder.start();
            isRecording = true;
            recBtn.classList.add('recording');
            recText.textContent = 'STOP';
        } catch (err) {
            console.error('Recording error:', err);
            alert("Hindi ma-activate ang recorder para sa stream na ito.");
        }
    }

    function stopRecording() {
        if (mediaRecorder && isRecording) {
            mediaRecorder.stop();
            isRecording = false;
            recBtn.classList.remove('recording');
            recText.textContent = 'RECORD';
        }
    }

    audio.volume = 1;
    loadDirectory2000();
</script>
</body>
</html>
